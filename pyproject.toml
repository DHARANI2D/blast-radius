[project]
name = "blastradius"
version = "0.1.0"
description = "Agentic change-safety mesh for HPE hybrid infrastructure (HPE Agentic AI Hackathon India 2026 PoC)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "mcp>=2.0,<3",
  "networkx>=3.3",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "streamlit>=1.50",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blastradius = "blastradius.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blastradius*"]

[tool.setuptools.package-data]
"blastradius.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
